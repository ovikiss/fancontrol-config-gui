services:
  fancontrol-config-gui:
    build:
      context: /mnt/dsm-docker/fancontrol-config-gui/source
      args:
        UI_SHARED_REV: main
    container_name: fancontrol-config-gui
    restart: unless-stopped
    ports:
      - "8180:4173"
    volumes:
      - /mnt/dsm-docker/fancontrol-config-gui/data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4173/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
